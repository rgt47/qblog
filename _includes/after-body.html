<!-- Fix for Quarto category encoding issue -->
<script>
// Fix category encoding for Quarto listing functionality
(function() {
  function fixAllCategoryEncoding() {
    // Only run on pages that have Quarto listings
    if (!document.querySelector('.quarto-listing')) {
      return;
    }
    
    // Fix sidebar category data-category attributes
    const categoryEls = document.querySelectorAll('.quarto-listing-category .category[data-category]');
    
    categoryEls.forEach((categoryEl) => {
      const category = categoryEl.getAttribute('data-category');
      
      if (category && category !== '') {
        // Check if it contains only base64 characters and proper length
        const isBase64 = /^[A-Za-z0-9+/]*={0,2}$/.test(category) && category.length % 4 === 0;
        
        if (isBase64) {
          try {
            const decoded = decodeURIComponent(atob(category));
            // Verify it decoded to something reasonable (no control characters)
            if (!decoded.match(/^[A-Za-z0-9\s\-,]+$/)) {
              // Invalid encoding, re-encode from original text
              const encodedCategory = btoa(encodeURIComponent(categoryEl.textContent.trim()));
              categoryEl.setAttribute('data-category', encodedCategory);
            }
          } catch (e) {
            // Base64 decode failed, re-encode from original text
            const encodedCategory = btoa(encodeURIComponent(categoryEl.textContent.trim()));
            categoryEl.setAttribute('data-category', encodedCategory);
          }
        } else {
          // Not base64, encode it
          const encodedCategory = btoa(encodeURIComponent(category));
          categoryEl.setAttribute('data-category', encodedCategory);
        }
      }
    });
    
    // Fix listing item data-categories attributes  
    const listingItems = document.querySelectorAll('[data-categories]');
    
    listingItems.forEach((item) => {
      const categories = item.getAttribute('data-categories');
      
      if (categories && categories !== '') {
        // Check if it's already base64 encoded
        try {
          decodeURIComponent(atob(categories));
          // Already encoded and valid
        } catch (e) {
          // Not encoded, fix it
          const encodedCategories = btoa(encodeURIComponent(categories));
          item.setAttribute('data-categories', encodedCategories);
        }
      }
    });
    
    // Fix post-specific category tag click handlers
    const postCategoryTags = document.querySelectorAll('.listing-category[onclick]');
    
    postCategoryTags.forEach((tag) => {
      const categoryText = tag.textContent.trim();
      
      // Replace the onclick handler to use encoded category
      tag.onclick = () => {
        const encodedCategory = btoa(encodeURIComponent(categoryText));
        window.quartoListingCategory(encodedCategory);
        return false;
      };
    });
  }
  
  // Run immediately
  fixAllCategoryEncoding();
  
  // Also run when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fixAllCategoryEncoding);
  }
})();
</script>

<!-- PDF view/download button for blog posts -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Only add the button on post pages
  if (window.location.pathname.includes('/posts/') && !window.location.pathname.endsWith('/posts/') && !window.location.pathname.endsWith('/posts/index.html')) {
    var currentPath = window.location.pathname;
    // Handle both /posts/name/ and /posts/name/index.html formats
    var pdfPath;
    if (currentPath.endsWith('/')) {
      pdfPath = currentPath + 'index.pdf';
    } else {
      pdfPath = currentPath.replace('.html', '.pdf');
    }

    // Check if PDF exists first
    fetch(pdfPath, { method: 'HEAD' })
      .then(function(response) {
        if (response.ok) {
          // PDF exists, show download button
          showDownloadButton(pdfPath);
        }
        // If PDF doesn't exist, don't show any button
      })
      .catch(function(error) {
        // Error checking PDF, don't show any button
      });
  }
});

function showDownloadButton(pdfPath) {
  var downloadBtn = document.createElement('div');
  downloadBtn.className = 'pdf-download-button';

  // Get file size if possible
  fetch(pdfPath, { method: 'HEAD' })
    .then(function(response) {
      var size = response.headers.get('Content-Length');
      var sizeText = '';

      if (size) {
        // Convert to MB or KB
        var sizeInMB = size / (1024 * 1024);
        if (sizeInMB >= 1) {
          sizeText = ' (' + sizeInMB.toFixed(1) + ' MB)';
        } else {
          sizeText = ' (' + (size / 1024).toFixed(0) + ' KB)';
        }
      }

      downloadBtn.innerHTML =
        '<div class="alert alert-secondary d-flex align-items-center p-3" role="alert">' +
        '  <a href="' + pdfPath + '" class="btn btn-primary btn-sm me-3" target="_blank">' +
        '    <i class="bi bi-file-pdf me-1"></i> Download PDF' + sizeText +
        '  </a>' +
        '  <span class="small text-muted">View or save a printer-friendly version of this article</span>' +
        '</div>';
    })
    .catch(function() {
      // Basic fallback if we can't get file size
      downloadBtn.innerHTML =
        '<div class="alert alert-secondary d-flex align-items-center p-3" role="alert">' +
        '  <a href="' + pdfPath + '" class="btn btn-primary btn-sm me-3" target="_blank">' +
        '    <i class="bi bi-file-pdf me-1"></i> Download PDF' +
        '  </a>' +
        '  <span class="small text-muted">View or save a printer-friendly version of this article</span>' +
        '</div>';
    });

  // Find where to insert the button (right after the title block)
  var titleBlock = document.querySelector('.quarto-title-meta');
  if (titleBlock) {
    titleBlock.after(downloadBtn);
  }
}


</script>

    '50-pp': 'penguins-arc',
    '51-pp': 'penguins-arc',
    '52-pp': 'penguins-arc',
    '53-pp': 'penguins-arc',

    '56-pp': 'penguins-arc',
    '62-rl': 'r-language',
    '63-rl': 'r-language',
    '70-rp': 'r-packages',
    '72-rp': 'r-packages',
    '73-rp': 'r-packages',
    '74-rp': 'r-packages',
    '80-pub': 'publishing',
    '81-pub': 'publishing',
    '83-pub': 'publishing',
    '84-pub': 'publishing',
    '90-shy': 'shiny',
    '91-shy': 'shiny',
    '95-cln': 'clinical-and-cloud',
    '96-cln': 'clinical-and-cloud',
    '97-cln': 'clinical-and-cloud'
  };

  // Cluster color scheme (matching Quarto's default colors)
  const clusterColors = {
    'zzcollab-compendia': '#0d3472',
    'workflow-construct': '#4986e7',
    'penguins-arc': '#f691b3',
    'security-and-sync': '#f2c960',
    'r-packages': '#8e63ce',
    'publishing': '#43d692',
    'clinical-and-cloud': '#a4c2f4',
    'shiny': '#ffad47',
    'shell-and-git': '#6d9eeb',
    'r-language': '#fcda83'
  };

  // Human-readable cluster names
  const clusterNames = {
    'zzcollab-compendia': 'ZZCOLLAB Compendia',
    'workflow-construct': 'Workflow Construct',
    'penguins-arc': 'Penguins Arc',
    'security-and-sync': 'Security & Sync',
    'r-packages': 'R Packages',
    'publishing': 'Publishing',
    'clinical-and-cloud': 'Clinical & Cloud',
    'shiny': 'Shiny',
    'shell-and-git': 'Shell & Git',
    'r-language': 'R Language'
  };

  function initClusterFiltering() {
    // Only run on blog listing pages
    if (!document.querySelector('.quarto-listing')) {
      return;
    }

    const sidebarContainer = document.getElementById('cluster-sidebar');
    if (!sidebarContainer) {
      return;
    }

    // Get all post links
    const postLinks = document.querySelectorAll('a[href*="posts/"]');
    if (postLinks.length === 0) {
      return;
    }

    // Build cluster map from post names (deduplicate)
    const clusterMap = new Map();
    const postClusterMap = new Map();
    const seenPosts = new Set();

    for (const link of postLinks) {
      const href = link.getAttribute('href');
      if (!href || !href.includes('posts/')) continue;

      // Extract post name (e.g., "25-wf-linux-mint-on-macbook")
      const postNameMatch = href.match(/posts\/(\d+-[a-z]+)/);
      if (!postNameMatch) continue;

      const postName = postNameMatch[1];

      // Skip if we've already processed this post
      if (seenPosts.has(postName)) continue;
      seenPosts.add(postName);

      const prefix = postName.substring(0, 5); // e.g., "25-wf"

      const cluster = clusterMapping[prefix];
      if (cluster) {
        postClusterMap.set(postName, cluster);

        if (!clusterMap.has(cluster)) {
          clusterMap.set(cluster, []);
        }
        clusterMap.get(cluster).push(postName);
      }
    }

    if (clusterMap.size === 0) {
      return; // No clusters found
    }

    // Create clusters sidebar HTML
    const sidebar = document.createElement('div');
    sidebar.className = 'quarto-listing-category card';
    sidebar.innerHTML = '<div class="card-body"><strong>Clusters</strong></div>';

    const clusterList = document.createElement('div');
    clusterList.className = 'list-group list-group-flush';

    // Sort clusters by count (descending)
    const sortedClusters = Array.from(clusterMap.entries())
      .sort((a, b) => b[1].length - a[1].length);

    // Add "All" option
    const allButton = document.createElement('button');
    allButton.className = 'list-group-item list-group-item-action category active';
    allButton.textContent = `All (${seenPosts.size})`;
    allButton.style.color = '#495057';
    allButton.onclick = (e) => {
      e.preventDefault();
      resetClusterFilter();
      updateActiveCluster(allButton);
    };
    clusterList.appendChild(allButton);

    // Add cluster buttons
    for (const [cluster, posts] of sortedClusters) {
      const button = document.createElement('button');
      button.className = 'list-group-item list-group-item-action category';
      button.textContent = `${clusterNames[cluster] || cluster} (${posts.length})`;
      button.style.color = clusterColors[cluster] || '#495057';
      button.style.fontWeight = '500';
      button.dataset.cluster = cluster;

      button.onclick = (e) => {
        e.preventDefault();
        filterByCluster(cluster, postClusterMap);
        updateActiveCluster(button);
      };

      clusterList.appendChild(button);
    }

    sidebar.appendChild(clusterList);

    // Remove cluster sidebar from original container (blog/index.qmd location)
    if (sidebarContainer && sidebarContainer.parentElement) {
      sidebarContainer.parentElement.removeChild(sidebarContainer);
    }

    // Find the categories sidebar parent and insert cluster before it
    const categoriesSidebar = document.querySelector('.quarto-listing-category');
    if (categoriesSidebar && categoriesSidebar.parentElement) {
      categoriesSidebar.parentElement.insertBefore(sidebar, categoriesSidebar);
    }

    // Add CSS styles
    if (!document.getElementById('cluster-sidebar-styles')) {
      const style = document.createElement('style');
      style.id = 'cluster-sidebar-styles';
      style.textContent = `
        #cluster-sidebar {
          margin-bottom: 1.5rem;
        }
        #cluster-sidebar .card {
          border: 1px solid #dee2e6;
          border-radius: 0.375rem;
        }
        #cluster-sidebar .card-body {
          padding: 1rem;
          font-weight: 600;
          color: #0d3472;
        }
        #cluster-sidebar .list-group {
          border: none;
        }
        #cluster-sidebar .list-group-item {
          border: none;
          border-bottom: 1px solid #e9ecef;
          padding: 0.5rem 0;
          background: transparent;
        }
        #cluster-sidebar .list-group-item:last-child {
          border-bottom: none;
        }
        #cluster-sidebar .list-group-item.active {
          background-color: #e7f1ff;
          color: #0d3472;
          border-color: transparent;
          font-weight: 600;
        }
        #cluster-sidebar .category {
          cursor: pointer;
          color: #0d3472;
          padding: 0.375rem 0;
          display: block;
          text-decoration: none;
          transition: color 0.15s ease-in-out;
        }
        #cluster-sidebar .category:hover {
          text-decoration: underline;
        }
        #cluster-sidebar .category.active {
          font-weight: 600;
          color: #0d3472;
        }
        .cluster-hidden {
          display: none !important;
        }
      `;
      document.head.appendChild(style);
    }
  }

  function filterByCluster(cluster, postClusterMap) {
    // Hide all post elements first
    const allLinks = document.querySelectorAll('a[href*="posts/"]');
    const hiddenPosts = new Set();

    allLinks.forEach(link => {
      const href = link.getAttribute('href');
      const postNameMatch = href.match(/posts\/(\d+-[a-z\-]+)/);
      if (!postNameMatch) return;

      const postName = postNameMatch[1];
      const itemCluster = postClusterMap.get(postName);

      // Hide the parent quarto-post element if cluster doesn't match
      let postElement = link.closest('.quarto-post');
      if (postElement) {
        if (itemCluster !== cluster) {
          postElement.classList.add('cluster-hidden');
          hiddenPosts.add(postName);
        } else {
          postElement.classList.remove('cluster-hidden');
        }
      }
    });
  }

  function resetClusterFilter() {
    const items = document.querySelectorAll('.quarto-listing-item');
    items.forEach(item => {
      item.classList.remove('cluster-hidden');
    });
  }

  function updateActiveCluster(activeButton) {
    const buttons = document.querySelectorAll('#cluster-sidebar .category');
    buttons.forEach(btn => {
      btn.classList.remove('active');
    });
    activeButton.classList.add('active');
  }

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initClusterFiltering);
  } else {
    initClusterFiltering();
  }
})();
</script>
